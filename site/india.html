 <div class="grid"><article class="card"><div class="card-head"><div><h2 id="path-title"></h2><p class="subtext">Quarterly actuals → composite & RBI</p></div><div class="segment" aria-label="Forecast indicator"><button data-metric="gdp" aria-pressed="${metric==='gdp'}">GDP</button><button data-metric="cpi" aria-pressed="${metric==='cpi'}">CPI</button></div></div><div id="path-legend"></div><div class="chart" id="overview-chart"></div><p id="path-note" class="chart-note"></p><div id="overview-forecast"></div><div id="overview-history"></div></article>
 <article class="card"><div class="card-head"><div><h2>Activity & external position</h2><p class="subtext">Latest available observations</p></div></div><div class="card-body"><table class="data-table"><thead><tr><th>Indicator</th><th>Latest</th><th>Change</th></tr></thead><tbody>
 <tr><td>Industrial production<span class="period">July 2026 · YoY</span></td><td>${pct(obs('INPIINDY Index').raw_value)}</td><td>—</td></tr><tr><td>Goods exports<span class="period">July 2026 · YoY</span></td><td>${pct(obs('INMTEXUY Index').raw_value)}</td><td>—</td></tr><tr><td>Goods imports<span class="period">July 2026 · YoY</span></td><td>${pct(obs('INMTIMUY Index').raw_value)}</td><td>—</td></tr><tr><td>Food CPI<span class="period">July 2026 · YoY</span></td><td>${pct(DATA.headline.food)}</td><td>${delta(DATA.headline.food,DATA.headline.foodPrevious)}</td></tr><tr><td>Unemployment<span class="period">July 2026 · age 15+</span></td><td>${pct(DATA.headline.unemployment)}</td><td>${delta(DATA.headline.unemployment,DATA.headline.unemploymentPrevious)}</td></tr></tbody></table><p class="note inline">Arrows show change from the previous observation. A higher inflation rate is not treated as a positive outcome.</p>
 <h3 class="minor-heading">What is driving the data?</h3><p class="subtext">Food contributes about ${num(DATA.inflation[0].contribution)} pp to July inflation. Investment and consumption both support real GDP growth.</p></div><details class="expand"><summary>Reading this snapshot</summary><div class="inside"><p>Dates vary by release. GDP and forecast charts are quarterly; the CPI headline is monthly. Current account and overall BoP use the same IMF quarterly source through 2026-Q1.</p><p>Forecasts are quarterly YoY rates. Annual comparisons are omitted until source-period conventions are reconciled. This snapshot was compiled before the scheduled August CPI release.</p><p>*Net reserves means adjusted FCA: foreign-currency assets plus signed net forwards, excluding gold, SDRs and the IMF reserve tranche. Uses FCA dated ${date(DATA.reserves.latest.fcaDate)} and forwards dated ${date(DATA.reserves.latest.forwardDate)}. Details are in Growth & External.</p></div></details></article></div>${sourceLinks([['gdp','MoSPI GDP'],['cpi','MoSPI CPI'],['labour','PLFS labour'],['rbi','RBI forecasts'],['ca_api','IMF current account']])}`;
 $('panel-overview').querySelectorAll('[data-metric]').forEach(b=>b.addEventListener('click',()=>{metric=b.dataset.metric;renderOverview();drawOverview()}));
 drawOverview();
}
function drawOverview(){if(!$('overview-chart'))return;const series=forecastSeries(metric);$('path-title').textContent=metric==='gdp'?'Real GDP growth · % YoY':'Headline CPI · % YoY';$('path-legend').innerHTML=legend(series);$('path-note').textContent=metric==='cpi'?'Quarterly CPI averages. The line breaks at the 2026 CPI base change.':'Changes below each forecast are percentage points versus the prior quarter’s YoY rate.';$('overview-forecast').innerHTML=forecastBlock(metric);$('overview-history').innerHTML=historyTable(metric);lineChart('overview-chart',DATA.periods,series,{forecastStart:4,title:metric.toUpperCase()+' actuals and forecasts, percent year on year'})}
function renderInflation(){const rows=[...DATA.inflation].sort((a,b)=>b.contribution-a.contribution),max=Math.max(...rows.map(r=>r.contribution));$('panel-inflation').innerHTML=`<div class="section-intro"><p><strong>July CPI ${pct(DATA.headline.cpi)}</strong> ${delta(DATA.headline.cpi,DATA.headline.cpiPrevious,'change')} versus June</p><p>2024 base · Combined CPI · Provisional</p></div><div class="grid equal"><article class="card"><div class="card-head"><div><h2>What contributes to inflation?</h2><p class="subtext">Estimated contribution to the headline rate</p></div></div><div class="card-body"><table class="data-table driver-table"><thead><tr><th>Division</th><th>YoY</th><th>Contribution, pp</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.label)}<div class="weight">${num(r.weight,1)}% basket weight</div></td><td>${pct(r.yoy)}</td><td class="barcell"><span class="barvalue">${num(r.contribution)}</span><div class="bar-track"><div class="bar-fill" style="width:${100*r.contribution/max}%"></div></div></td></tr>`).join('')}</tbody></table></div><details class="expand"><summary>Calculation & item examples</summary><div class="inside"><p>Contributions are reconstructed from official division weights, current indices and YoY rates. They sum to ${num(rows.reduce((s,r)=>s+r.contribution,0))} pp; the published headline is 4.45%. Small differences reflect rounding.</p><p>July item inflation: silver jewellery 109.84%; gold/diamond/platinum 32.98%; potatoes −16.56%; tomatoes −4.59%. Large item price changes do not necessarily mean large headline contributions.</p></div></details></article>
 <article class="card"><div class="card-head"><div><h2>Inflation trend</h2><p class="subtext">Monthly headline CPI · % YoY</p></div></div><div class="chart" id="monthly-cpi-chart"></div><div class="highlight">Food & beverages: ${num(rows.find(r=>r.code==='01').contribution)} pp. Personal care & other goods/services: ${num(rows.find(r=>r.code==='13').contribution)} pp.</div><div class="card-head"><div><h2>Quarterly inflation outlook</h2><p class="subtext">Quarterly average YoY, not month-end inflation</p></div></div>${forecastBlock('cpi')}<p class="chart-note">Quarterly forecasts compare with the Apr–Jun actual average of 3.93%, not July’s monthly reading.</p></article></div>${sourceLinks([['cpi','MoSPI July CPI'],['weights','Official CPI weights'],['rbi','RBI projections']])}`;drawInflation()}
function drawInflation(){lineChart('monthly-cpi-chart',DATA.cpiMonthly.map(r=>month(r.date)),[{name:'Headline CPI',values:DATA.cpiMonthly.map(r=>r.value),color:COLORS.Composite}],{title:'Monthly India headline CPI, percent year on year'})}
function renderGrowth(){const max=Math.max(...DATA.growth.map(r=>Math.abs(r.contribution))),ca=DATA.currentAccount,latest=ca.at(-1),four=ca.slice(-4).reduce((s,r)=>s+r.value,0);$('panel-growth').innerHTML=`<div class="section-intro"><p><strong>Real GDP ${pct(DATA.headline.gdp,1)}</strong> ${delta(DATA.headline.gdp,DATA.headline.gdpPrevious,'change')} versus prior quarter’s YoY</p><p>Apr–Jun 2026 · Constant 2022–23 prices</p></div><div class="grid equal"><div class="growth-stack"><article class="card"><div class="card-head"><div><h2>Sources of GDP growth</h2><p class="subtext">Expenditure contributions · percentage points</p></div></div><div class="card-body"><table class="data-table driver-table"><thead><tr><th>Component</th><th>Contribution, pp</th></tr></thead><tbody>${DATA.growth.map(r=>`<tr><td>${esc(r.label)}</td><td class="barcell"><span class="barvalue">${r.contribution>0?'+':''}${num(r.contribution)}</span><div class="bar-track"><div class="bar-fill ${r.contribution<0?'negative':''}" style="width:${100*Math.abs(r.contribution)/max}%"></div></div></td></tr>`).join('')}</tbody></table><p class="note inline">Imports enter GDP with a negative sign. Statistical discrepancies account for ${num(DATA.growth.at(-1).contribution)} pp.</p></div><details class="expand"><summary>Quarterly GDP forecasts</summary><div class="inside">${forecastTable('gdp',['Composite','RBI','Goldman','Citi'])}</div></details><details class="expand"><summary>Methodology</summary><div class="inside"><p>Contribution = change in the real component versus the same quarter last year, divided by prior-year real GDP, with imports subtracted. Official rounded components differ from the published total by INR 1 crore.</p></div></details></article>
 ${reserveCard()}</div>
 <article class="card"><div class="card-head"><div><h2>Balance of payments</h2><p class="subtext">Quarterly flows · USD billion</p></div><label class="bop-period-label">Quarter<select id="bop-period" aria-label="BoP table quarter">${[...DATA.bop.history].reverse().map(r=>`<option value="${r.period}">${quarter(r.date)}</option>`).join('')}</select></label></div><div id="bop-table"></div><div class="card-head external-chart-head"><div><h3 id="external-chart-title" class="minor-heading"></h3><p class="subtext">Positive = surplus · negative = deficit</p></div><div class="segment" aria-label="External balance chart"><button data-external="bop" aria-pressed="${externalMetric==='bop'}">BoP</button><button data-external="ca" aria-pressed="${externalMetric==='ca'}">Current account</button></div></div><div class="chart" id="ca-chart"></div><p class="chart-note">Chart covers ${quarter(DATA.bop.history[0].date)}–${quarter(DATA.bop.history.at(-1).date)}. Table selector changes the breakdown above.</p><details class="expand"><summary>Definitions & sources</summary><div class="inside"><p>Positive financial flows mean net inflows to India; negative means net outflows. Overall BoP is the reserve-asset transaction flow, excluding valuation changes. Current account + capital account + financial inflows + errors and omissions = overall BoP.</p><p>IMF BPM6 quarterly data, retrieved ${date(DATA.bop.retrievedUtc.slice(0,10))}. The table and chart use a common source and frequency. Gross reserve stocks are separate from this flow measure.</p></div></details></article></div>${sourceLinks([['gdp','MoSPI expenditure GDP'],['gdp_api','IMF GDP history'],['bop_api','IMF BoP components'],['ca_api','IMF current account'],['rbi','RBI projections']])}`;
 $('bop-period').value=bopPeriod||DATA.bop.history.at(-1).period;
 $('bop-period').addEventListener('change',e=>{bopPeriod=e.target.value;renderBopTable()});
 $('panel-growth').querySelectorAll('[data-external]').forEach(b=>b.addEventListener('click',()=>{externalMetric=b.dataset.external;drawGrowth()}));
 $('panel-growth').querySelectorAll('[data-reserve]').forEach(b=>b.addEventListener('click',()=>{reserveMetric=b.dataset.reserve;drawReserves()}));
 renderBopTable();drawGrowth()
}

function renderBopTable(){const r=DATA.bop.history.find(r=>r.period===$('bop-period').value)||DATA.bop.history.at(-1),fmt=v=>(v>0?'+':'')+num(v,2);bopPeriod=r.period;
 $('bop-table').innerHTML=`<div class="card-body"><table class="data-table bop-table"><caption class="visually-hidden">Balance of payments, ${quarter(r.date)}, USD billion</caption><thead><tr><th>Component</th><th>${quarter(r.date)} · USD bn</th></tr></thead><tbody>${['ca','capital','fdi','portfolio','other','derivatives','eo','bop'].map(k=>`<tr class="${k==='ca'||k==='bop'?'subtotal':''}"><td>${bopLabels[k]}</td><td class="${r[k]<0?'negative-value':''}">${fmt(r[k])}</td></tr>`).join('')}</tbody></table></div><details class="expand"><summary>Inside the current account</summary><div class="inside"><table class="data-table"><thead><tr><th>Component</th><th>USD bn</th></tr></thead><tbody>${['goods','services','primary','secondary'].map(k=>`<tr><td>${bopLabels[k]}</td><td>${fmt(r[k])}</td></tr>`).join('')}</tbody></table><p>These four balances sum to the current account above.</p></div></details>`
}
function drawGrowth(){const history=DATA.bop.history,name=externalMetric==='bop'?'Overall BoP':'Current account';$('external-chart-title').textContent=name+' · USD bn';$('panel-growth').querySelectorAll('[data-external]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.external===externalMetric)));lineChart('ca-chart',history.map(r=>quarter(r.date)),[{name,values:history.map(r=>r[externalMetric]),color:COLORS.Composite}],{zero:true,unit:' USD bn',title:name+', India quarterly flows in US dollars, billions'});drawReserves()}

function reserveCard(){const r=DATA.reserves.latest;return `<article class="card reserves-card"><div class="card-head"><div><h2>Net reserves · adjusted FCA</h2><p class="subtext">FCA + signed net forwards · USD billion</p></div></div><div class="reserve-stats"><div><small>FCA</small><strong>${num(r.fca,1)}</strong><small>${date(r.fcaDate)}</small></div><div><small>Net forwards</small><strong class="negative-value">${num(r.forwards,1)}</strong><small>${date(r.forwardDate)}</small></div><div class="adjusted-stat"><small>Adjusted FCA</small><strong>${num(r.adjusted,1)}</strong><small>Latest-input estimate</small></div></div><p class="chart-note">Holds the ${month(r.forwardDate)} forward book constant against newer FCA. Gold, SDRs and IMF reserves excluded.</p><div class="card-head reserve-controls"><span id="reserve-chart-title" class="subtext"></span><div class="segment" aria-label="Reserves chart"><button data-reserve="adjusted" aria-pressed="${reserveMetric==='adjusted'}">FCA vs net</button><button data-reserve="forwards" aria-pressed="${reserveMetric==='forwards'}">Forward book</button></div></div><div id="reserve-legend"></div><div id="reserves-chart" class="chart"></div><details class="expand"><summary>Sources, dates & definition</summary><div class="inside"><p>Gross reserves: ${num(obs('INMORES$ Index').value,1)}bn (${date(obs('INMORES$ Index').date)}). Adjusted FCA uses only the foreign-currency asset component plus signed net forwards; a short forward book reduces it.</p><p>Bloomberg history: INMOFCA$ Index and INUSOONT Index. The forward series stops at ${month(DATA.reserves.vendorForwardLatest.date)}; <a href="${esc(DATA.reserves.sourceUrl)}" target="_blank" rel="noopener">RBI’s July release</a> supplies ${num(DATA.reserves.rbiExtension.value,3)}bn, published ${date(DATA.reserves.rbiExtension.published)}.</p><p>All maturities included: up-to-one-year short + long positions, plus the over-one-year memo item. The separately reported NDF memo item is excluded to retain the legacy series scope.</p><p>Chart uses monthly reference dates and the last available weekly FCA. Later points carry July forwards; point details retain both observation dates. This is a reference-date history, not a publication-date backtest.</p></div></details></article>`}
function drawReserves(){if(!$('reserves-chart'))return;const h=DATA.reserves.history,isFwd=reserveMetric==='forwards';const tips=h.map(r=>'FCA '+date(r.fcaDate)+'; forwards '+date(r.forwardDate)+(r.carriedForward?' (carried forward)':''));const series=isFwd?[{name:'Net forwards',color:COLORS.RBI,values:h.map(r=>r.forwards),tips}]:[{name:'FCA',color:COLORS.Composite,values:h.map(r=>r.fca),tips},{name:'Adjusted FCA',color:COLORS.Actual,values:h.map(r=>r.adjusted),tips}];$('reserve-chart-title').textContent=isFwd?'Signed forward position':'Monthly reference-date history';$('reserve-legend').innerHTML=legend(series);$('panel-growth').querySelectorAll('[data-reserve]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.reserve===reserveMetric)));lineChart('reserves-chart',h.map(r=>month(r.date)),series,{unit:' USD bn',zero:isFwd,labelEvery:4,title:isFwd?'RBI signed net forward position':'FCA and adjusted FCA, USD billion'})}

function activate(tab,focus=false){activeTab=tab;document.querySelectorAll('[data-tab]').forEach(b=>{const yes=b.dataset.tab===tab;b.setAttribute('aria-selected',String(yes));b.tabIndex=yes?0:-1;if(yes&&focus)b.focus()});['overview','inflation','growth'].forEach(t=>$('panel-'+t).hidden=t!==tab);if(DATA){if(tab==='overview')drawOverview();if(tab==='inflation')drawInflation();if(tab==='growth')drawGrowth()}history.replaceState(null,'','#'+tab)}
document.querySelectorAll('[data-tab]').forEach((b,i)=>{b.addEventListener('click',()=>activate(b.dataset.tab));b.addEventListener('keydown',e=>{const tabs=['overview','inflation','growth'];let n;if(e.key==='ArrowRight')n=(i+1)%3;if(e.key==='ArrowLeft')n=(i+2)%3;if(e.key==='Home')n=0;if(e.key==='End')n=2;if(n!==undefined){e.preventDefault();activate(tabs[n],true)}})});
function exportData(){const rows=[['Country','Indicator','Period','Series','Value','Unit','Source update']];for(const m of ['gdp','cpi']){DATA.actuals[m].forEach((v,i)=>rows.push(['India',m.toUpperCase(),DATA.periods[i],'Actual',v,'% YoY','Saved XECF snapshot 2026-09-14']));DATA.forecasts[m].forEach(r=>r.values.forEach((v,i)=>rows.push(['India',m.toUpperCase(),DATA.periods[i+4],r.name,v,'% YoY',r.updated.join('; ')])))}DATA.inflation.forEach(r=>rows.push(['India',r.label,'Jul 2026','Inflation contribution',r.contribution,'pp','2026-08-12']));DATA.currentAccount.forEach(r=>rows.push(['India','Current account',r.date,'Actual',r.value,'USD bn','Snapshot 2026-09-14']));DATA.cpiMonthly.forEach(r=>rows.push(['India','Headline CPI',r.date,'Actual',r.value,'% YoY',DATA.periodsMeta.cpiRelease]));DATA.growth.forEach(r=>rows.push(['India',r.label,DATA.periodsMeta.gdp,'GDP contribution',r.contribution,'pp','MoSPI']));DATA.snapshots.forEach(r=>rows.push(['India',r.concept,r.date,r.ticker,r.unit==='% YoY'||r.unit==='%'?r.raw_value:r.value,r.unit,r.source]));DATA.bop.history.forEach(r=>Object.keys(bopLabels).forEach(k=>rows.push(['India',bopLabels[k],r.period,'IMF BoP',r[k],'USD bn',DATA.bop.retrievedUtc])));DATA.reserves.history.forEach(r=>{for(const [k,label] of [['fca','FCA'],['forwards','Net forwards'],['adjusted','Adjusted FCA']])rows.push(['India',label,r.date,'Bloomberg / RBI',r[k],'USD bn','FCA '+r.fcaDate+'; forwards '+r.forwardDate])});const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}));const a=document.createElement('a');a.href=url;a.download='India-macro-'+DATA.snapshot+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('download').addEventListener('click',exportData);
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(!DATA)return;if(activeTab==='overview')drawOverview();else if(activeTab==='inflation')drawInflation();else drawGrowth()},150)});
async function load(){try{DATA=window.INDIA_DATA;if(!DATA)throw Error("Snapshot missing");renderOverview();renderInflation();renderGrowth();$('snapshot-date').textContent='Snapshot · '+new Date(DATA.compiledUtc).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Singapore'})+' SGT';$('usage').textContent='Bloomberg reserved · '+DATA.bbgBudget.used.toLocaleString()+' / '+DATA.bbgBudget.limit.toLocaleString()+' cells';$('usage').title=DATA.bbgBudget.method;$('download').disabled=false;$('load-status').textContent='';activate(['overview','inflation','growth'].includes(location.hash.slice(1))?location.hash.slice(1):'overview')}catch(e){$('load-status').innerHTML='India data could not be loaded. <button class="quiet-button" id="retry">Retry</button>';$('retry').onclick=load;console.error(e)}}load();

function reportHeight(){if(window.parent!==window)window.parent.postMessage({type:"india-height",height:Math.ceil(document.getElementById("india-app").getBoundingClientRect().height)+4},"*")}
new ResizeObserver(()=>requestAnimationFrame(reportHeight)).observe(document.getElementById("india-app"));
</script></body></html>
